
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEase | Online Store</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }
    header {
      background: #172554;
      color: white;
      padding: 20px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { margin: 0; }
    main { padding: 30px 6%; }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 20px;
    }
    .card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0000000d;
    }
    .product-image {
      height: 145px;
      display: grid;
      place-items: center;
      background: #eef2ff;
      border-radius: 8px;
      font-size: 60px;
    }
    .card h3 { margin-bottom: 8px; }
    .price { font-weight: bold; font-size: 18px; }
    button {
      border: 0;
      border-radius: 7px;
      padding: 11px 14px;
      cursor: pointer;
      background: #2563eb;
      color: white;
    }
    button:hover { background: #1d4ed8; }
    .cart, .checkout {
      background: white;
      margin-top: 28px;
      padding: 22px;
      border-radius: 12px;
    }
    input {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 7px;
    }
    .remove { background: #dc2626; margin-left: 8px; }
    #message { color: #166534; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>ShopEase</h1>
    <div>🛒 Cart: <span id="cart-count">0</span></div>
  </header>

  <main>
    <h2>Our Products</h2>
    <p>Discover everyday essentials at great prices.</p>
    <section class="products" id="products"></section>

    <section class="cart">
      <h2>Your Cart</h2>
      <div id="cart-items">Your cart is empty.</div>
      <h3>Total: ₹<span id="total">0</span></h3>
    </section>

    <section class="checkout">
      <h2>Checkout</h2>
      <form id="checkout-form">
        <input id="customer-name" placeholder="Full name" required>
        <input id="customer-email" type="email" placeholder="Email address" required>
        <input id="customer-address" placeholder="Delivery address" required>
        <button type="submit">Place Demo Order</button>
      </form>
      <p id="message"></p>
    </section>
  </main>

  <script>
    const products = [
      { id: 1, name: "Classic Sneakers", price: 1999, emoji: "👟" },
      { id: 2, name: "Smart Watch", price: 2499, emoji: "⌚" },
      { id: 3, name: "Headphones", price: 1499, emoji: "🎧" },
      { id: 4, name: "Travel Backpack", price: 999, emoji: "🎒" }
    ];

    const cart = [];

    function renderProducts() {
      document.getElementById("products").innerHTML =
        products.map(p => `
          <article class="card">
            <div class="product-image">${p.emoji}</div>
            <h3>${p.name}</h3>
            <p class="price">₹${p.price.toLocaleString("en-IN")}</p>
            <button onclick="addToCart(${p.id})">Add to Cart</button>
          </article>
        `).join("");
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const item = cart.find(p => p.id === id);
      if (item) item.quantity++;
      else cart.push({ ...product, quantity: 1 });
      renderCart();
    }

    function changeQuantity(id, change) {
      const item = cart.find(p => p.id === id);
      if (!item) return;
      item.quantity += change;
      if (item.quantity <= 0) {
        cart.splice(cart.indexOf(item), 1);
      }
      renderCart();
    }

    function renderCart() {
      const count = cart.reduce((sum, p) => sum + p.quantity, 0);
      const total = cart.reduce((sum, p) => sum + p.price * p.quantity, 0);
      document.getElementById("cart-count").textContent = count;
      document.getElementById("total").textContent =
        total.toLocaleString("en-IN");

      document.getElementById("cart-items").innerHTML = cart.length
        ? cart.map(p => `
          <p>${p.name} — ₹${p.price.toLocaleString("en-IN")}
          × ${p.quantity}
          <button class="remove"
            onclick="changeQuantity(${p.id}, -1)">−</button>
          <button onclick="changeQuantity(${p.id}, 1)">+</button>
          </p>
        `).join("")
        : "Your cart is empty.";
    }

    document.getElementById("checkout-form")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        if (cart.length === 0) {
          document.getElementById("message").textContent =
            "Please add a product to your cart first.";
          return;
        }

        const order = {
          customer_name: document.getElementById("customer-name").value,
          email: document.getElementById("customer-email").value,
          address: document.getElementById("customer-address").value,
          items: cart.map(p => ({
            product: p.name,
            quantity: p.quantity,
            price: p.price
          })),
          total: cart.reduce((sum, p) => sum + p.price * p.quantity, 0)
        };

        document.getElementById("message").textContent =
          "Demo order placed! Order details are ready for automation.";
        console.log("Demo order:", order);
      });

    renderProducts();
  </script>

</html>
